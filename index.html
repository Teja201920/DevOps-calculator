<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="calculator" role="application" aria-label="DevOps Calculator">
      <header class="calculator-header">
        <h1>DEV-1 CALCULATOR</h1>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="previous-operand" data-previous-operand></div>
        <div class="current-operand" data-current-operand>0</div>
      </section>

      <section class="buttons" aria-label="Calculator keypad">
        <button type="button" class="btn btn-function" data-action="clear" aria-label="All Clear">AC</button>
        <button type="button" class="btn btn-function" data-action="delete" aria-label="Delete">DEL</button>
        <button type="button" class="btn btn-function" data-action="percent" aria-label="Percent">%</button>
        <button type="button" class="btn btn-operator" data-action="divide" aria-label="Divide">÷</button>

        <button type="button" class="btn btn-number" data-number="7">7</button>
        <button type="button" class="btn btn-number" data-number="8">8</button>
        <button type="button" class="btn btn-number" data-number="9">9</button>
        <button type="button" class="btn btn-operator" data-action="multiply" aria-label="Multiply">×</button>

        <button type="button" class="btn btn-number" data-number="4">4</button>
        <button type="button" class="btn btn-number" data-number="5">5</button>
        <button type="button" class="btn btn-number" data-number="6">6</button>
        <button type="button" class="btn btn-operator" data-action="subtract" aria-label="Subtract">−</button>

        <button type="button" class="btn btn-number" data-number="1">1</button>
        <button type="button" class="btn btn-number" data-number="2">2</button>
        <button type="button" class="btn btn-number" data-number="3">3</button>
        <button type="button" class="btn btn-operator" data-action="add" aria-label="Add">+</button>

        <button type="button" class="btn btn-number btn-zero" data-number="0">0</button>
        <button type="button" class="btn btn-number" data-number=".">.</button>
        <button type="button" class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
